version: '3.8'

services:
  # SQL Server Express
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: indt-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - indt-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # API de Propostas
  api-propostas:
    build:
      context: ./backend/PropostasService
      dockerfile: Dockerfile
    container_name: indt-api-propostas
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=PropostasDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    ports:
      - "5001:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - indt-network
    restart: on-failure

  # API de Contratações
  api-contratacoes:
    build:
      context: ./backend/ContratacoesService
      dockerfile: Dockerfile
    container_name: indt-api-contratacoes
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ContratoesDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - Services__PropostasApi=http://api-propostas:80
    ports:
      - "5002:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      api-propostas:
        condition: service_started
    networks:
      - indt-network
    restart: on-failure

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indt-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-propostas
      - api-contratacoes
    networks:
      - indt-network
    restart: on-failure

networks:
  indt-network:
    driver: bridge

volumes:
  sqlserver-data:
